[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-c-agent-exam-benchmark"
version = "0.1.1"
description = "Reproducible agent runs and independent formal acceptance for 1C tasks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
exam-bench = "exam_bench.cli:main"

[tool.setuptools.packages.find]
include = ["exam_bench*", "tools*"]
